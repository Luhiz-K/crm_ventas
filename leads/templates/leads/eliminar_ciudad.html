{% extends 'leads/base.html' %}

{% block titulo %}Eliminar ciudad{% endblock %}
{% block encabezado %}Eliminar ciudad{% endblock %}

{% block contenido %}
<div class="row justify-content-center">
    <div class="col-lg-5">
        <div class="card border-0 shadow-sm border-top border-danger border-4 p-4 text-center">
            <i class="bi bi-exclamation-triangle-fill text-danger" style="font-size: 2.5rem;"></i>
            <h4 class="fw-bold mt-2">¿Eliminar registro?</h4>
            <p class="mb-1">Vas a eliminar la ciudad: <strong>{{ ciudad.ciudad }}</strong>.</p>
            <p class="text-muted small">Esta acción no se puede deshacer.</p>
            <form method="post" class="mt-3 d-flex gap-2 justify-content-center">
                {% csrf_token %}
                <a href="{% url 'listar_ciudades' %}" class="btn btn-outline-secondary px-4">Cancelar</a>
                <button type="submit" class="btn btn-danger px-4"><i class="bi bi-trash"></i> Sí, eliminar</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
